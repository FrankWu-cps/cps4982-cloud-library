{% extends 'base.html' %}{% block content %}
<section class="library-heading"><div><p class="section-tag" data-i18n="readingRoom">A collection worth exploring</p><h1 data-i18n="headline">Find your next<br>chapter.</h1><p class="intro" data-i18n="intro">Search inside the books, not just their titles.</p></div><div class="collection-note"><span class="big-number" id="bookTotal">—</span><span data-i18n="booksToExplore">texts in the collection</span><div class="note-rule"></div><span id="collectionMeta" data-i18n="loading">Loading the real collection…</span></div></section>
<form id="searchForm" class="search-form" role="search"><label for="query" class="sr-only" data-i18n="queryLabel">Search words in books</label><span class="search-icon" aria-hidden="true">⌕</span><input id="query" name="q" type="search" autocomplete="off" maxlength="200" placeholder="Try love, adventure, or Sherlock…" data-placeholder="searchPlaceholder"><button class="primary" id="searchSubmit" type="submit" data-i18n="search">Search books</button></form><div class="search-extras"><div class="mode-group" role="group" aria-label="Search matching"><button type="button" class="mode active" data-mode="any" data-i18n="any">Any word</button><button type="button" class="mode" data-mode="all" data-i18n="all">All words</button><button type="button" class="mode" data-mode="phrase" data-i18n="phrase">Exact phrase</button></div><button type="button" class="text-button" id="surprise" data-i18n="surprise">Pick a book for me</button></div><div class="history" id="recentQueries" aria-label="Recent searches"></div>
<section class="catalog"><div class="catalog-top"><div><h2 id="resultHeading" data-i18n="allBooks">On the shelves</h2><p class="result-summary" id="resultSummary" role="status" aria-live="polite" data-i18n="loading">Loading the real collection…</p></div><div class="display-switch" aria-label="Display mode"><button type="button" id="gridView" class="active" aria-pressed="true" data-i18n="grid">Grid</button><button type="button" id="listView" aria-pressed="false" data-i18n="list">List</button></div></div><div class="filter-row"><label><span data-i18n="author">Author</span><select id="authorFilter"><option value="" data-i18n="allAuthors">All authors</option></select></label><label><span data-i18n="language">Book language</span><select id="languageFilter"><option value="" data-i18n="allLanguages">All languages</option></select></label><label><span data-i18n="sort">Sort by</span><select id="sortFilter"><option value="relevance" data-i18n="relevance">Relevance</option><option value="title" data-i18n="titleSort">Title A–Z</option><option value="author" data-i18n="authorSort">Author A–Z</option></select></label><button type="button" id="clearFilters" class="quiet" data-i18n="reset">Reset</button></div><div id="errorBox" class="error-box" role="alert" hidden><p id="errorText"></p><button class="quiet" id="retry" data-i18n="retry">Try again</button></div><div class="book-grid" id="books" aria-live="polite" aria-busy="true"></div><div class="pagination"><button class="quiet" id="previous" type="button" data-i18n="previous">Previous</button><span id="pageLabel"></span><button class="quiet" id="next" type="button" data-i18n="next">Next</button></div></section>
{% endblock %}
